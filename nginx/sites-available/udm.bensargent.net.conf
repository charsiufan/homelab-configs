# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name udm.bensargent.net;

    return 301 https://$host$request_uri;
}

# Reverse proxy to UDM SE
server {
    listen 443 ssl;
    server_name udm.bensargent.net;

    # SSL certificate (Let’s Encrypt, expanded to include udm.bensargent.net)
    ssl_certificate     /etc/letsencrypt/live/bensargent.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bensargent.net/privkey.pem;

    # Proxy to UDM SE
    location / {
        proxy_pass https://192.168.1.2;  # UDM SE LAN IP
        proxy_ssl_verify off;            # ignore UDM’s self-signed cert

        # Forward headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
