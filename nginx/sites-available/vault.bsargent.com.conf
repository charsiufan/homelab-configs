server {
    listen 80;
    server_name vault.bsargent.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    # Vaultwarden
    server_name vault.bsargent.com;

    # Apply security headers
    add_header X-Frame-Options "DENY";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Strict-Transport-Security "max-age=15552000" always;
    
    # Protect Against Clickjacking
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://image.tmdb.org;" always;
    
    ssl_certificate     /etc/ssl/certs/cf-origin-3sltv.pem;
    ssl_certificate_key /etc/ssl/private/cf-origin-3sltv.key;

    location / { 
    # Only allow traffic heading for dev-main, the main tailscale device
    # allow 192.168.1.16;
    # deny all;

    proxy_pass http://192.168.1.202:8090;
    proxy_cookie_path / "/; Secure; HttpOnly; SameSite=None";

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;

    # Tell Overseerr/NextAuth it's HTTPS at the edge (Cloudflare)
    proxy_set_header X-Forwarded-Proto  https;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Port   443;
    proxy_set_header X-Forwarded-Ssl    on;

    proxy_http_version 1.1;
    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         "upgrade";
    proxy_redirect off;
    # keep your limits if you want them
    # limit_req zone=one burst=10 nodelay;
    limit_except GET POST HEAD { deny all;}	
    }   
}
