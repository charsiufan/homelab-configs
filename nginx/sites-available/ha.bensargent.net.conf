server {
  listen 80;
  server_name ha.bensargent.net;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name ha.bensargent.net;

  # use the cert you already have
  ssl_certificate     /etc/letsencrypt/live/bensargent.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bensargent.net/privkey.pem;

  add_header Strict-Transport-Security "max-age=15552000" always;

  proxy_read_timeout 3600;
  proxy_send_timeout 3600;
  proxy_buffering off;

  location / {
    proxy_pass http://192.168.1.202:8123;

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Port   443;

    proxy_http_version 1.1;
    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         "upgrade";
    proxy_redirect off;
  }
}
