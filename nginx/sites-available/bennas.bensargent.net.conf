server {
    listen 80;
    server_name bennas.bensargent.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bennas.bensargent.net; 

    # Apply security headers
    add_header X-Frame-Options "DENY";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Strict-Transport-Security "max-age=15552000" always;
    
    # Protect Against Clickjacking
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://image.tmdb.org;" always;
    
    ssl_certificate     /etc/letsencrypt/live/bensargent.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bensargent.net/privkey.pem;

    location / {
    proxy_pass http://192.168.1.200:5000;
    proxy_cookie_path / "/; Secure; HttpOnly; SameSite=None";

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;

    # Tell Bennas/NextAuth it's HTTPS at the edge (Cloudflare)
    proxy_set_header X-Forwarded-Proto  https;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Port   443;
    proxy_set_header X-Forwarded-Ssl    on;

    proxy_http_version 1.1;
    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         $http_connection;
    proxy_redirect off;

    # keep your limits if you want them
    # limit_req zone=one burst=10 nodelay;
    limit_except GET POST HEAD { deny all;}
    
    # If service unavailable, divert to a holding page
    proxy_intercept_errors on;
    error_page 502 503 504 522 523 524 =200 /holding.html;	
    }

    # Holding page location
    location = /holding.html {
        root /usr/share/nginx/html;   # put the file at /usr/share/nginx/html/holding.html
        internal;                     # only accessible via error_page rewrite
        ssi on;
        add_header Cache-Control "no-store";
    }   
}


