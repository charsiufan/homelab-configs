server {
    listen 80;
    server_name audio.3sltv.net;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name audio.3sltv.net;

    # Apply security headers
    add_header X-Frame-Options "DENY";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Strict-Transport-Security "max-age=15552000" always;
    
    # Protect Against Clickjacking
#    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://image.tmdb.org;" always;
    
    ssl_certificate     /etc/ssl/certs/cf-origin-3sltv.pem;
    ssl_certificate_key /etc/ssl/private/cf-origin-3sltv.key;

    location / {
        proxy_pass http://192.168.1.202:13378; # Audiobookshelf server
        proxy_http_version 1.1;
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

	# Most important to avoid .gz issues
    # proxy_set_header Accept-Encoding "";
    proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "Upgrade";

	# Apply request limiting
    # limit_req zone=one burst=10 nodelay;
        
	# limit some request types
    # limit_except GET POST HEAD {
    # deny all;
    # }	
    }
}
